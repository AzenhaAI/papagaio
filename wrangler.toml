name = "papagaio"
main = "src/index.js"
compatibility_date = "2026-07-01"

# The app ships this hostname inside a store binary, so it must not carry a
# personal handle: papagaio.kirshp.workers.dev announced both the account and
# the GitHub repo to anyone watching the traffic. workers.dev keeps working as
# a fallback; everything published points here.
routes = [
  # azenha.ai is the product's home; shpara.com stays wired because binaries
  # already in the wild were built against it, and a hostname is forever once
  # it ships inside an app.
  #
  # The API lives on the apex under /api/*, not on a subdomain of its own:
  # papagaio.azenha.ai was never planned and has been deleted. Leaving its
  # custom_domain entry here would have been worse than untidy — a deploy
  # recreates whatever this list declares, so the next push would have
  # resurrected the subdomain behind everyone's back.
  { pattern = "azenha.ai/api/*", zone_name = "azenha.ai" },
  # The offline dictionary packs ride the apex too: build 3 fetches them from
  # azenha.ai/packs/, so this route is part of the app's contract.
  #
  # /dl/* is deliberately NOT routed here. On azenha.ai that path is the
  # site's own download folder (Pages: /dl/index.html plus three APKs), and
  # claiming it broke every one of those downloads on 20.08.2026 — the only
  # /dl link the PapaGaio page carries points at the Pages file, not at this
  # Worker. The Worker's own /dl/ handler (GitHub-release proxy for the mac
  # and windows zips that are too big for Pages) stays reachable where its
  # consumers actually live: papagaio.shpara.com and workers.dev, which route
  # every path.
  { pattern = "azenha.ai/packs/*", zone_name = "azenha.ai" },
  { pattern = "papagaio.shpara.com", custom_domain = true },
]
# Adding routes turns the workers.dev subdomain OFF unless it is asked for
# explicitly — which instantly 404s every already-installed app, since a
# shipped binary keeps calling the hostname it was built with. Keep it alive:
# it costs nothing and it is the fallback for every old download out there.
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "papagaio"
database_id = "67178255-f07a-43f7-98e2-cf45528e32e9"

# Workers AI: the vision model that reads text off a photo (src/vision.js).
# Same account as the Worker, so no extra credential.
[ai]
binding = "AI"

[vars]
AUDIO_BASE = "https://azenha.ai/papagaio/audio/"

# Secrets (not in this file): TG_TOKEN, WEBHOOK_SECRET, GROQ_API_KEY — see scripts/setup_webhook.sh
