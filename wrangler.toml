name = "papagaio"
main = "src/index.js"
compatibility_date = "2026-07-01"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "papagaio"
database_id = "67178255-f07a-43f7-98e2-cf45528e32e9"

# Workers AI: the vision model that reads text off a photo (src/vision.js).
# Same account as the Worker, so no extra credential.
[ai]
binding = "AI"

[vars]
AUDIO_BASE = "https://shpara.com/papagaio/audio/"

# Secrets (not in this file): TG_TOKEN, WEBHOOK_SECRET, GROQ_API_KEY — see scripts/setup_webhook.sh
